name: ${COMPOSE_PROJECT_NAME:-mis-project}

x-default-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

services:
  # This file is the development stack. Direct host ports and bind mounts are
  # intentionally kept here; docker-compose.production.yml has neither.
  nginx:
    image: nginx:1.27-alpine
    ports:
      - "80:80"
    restart: unless-stopped
    logging: *default-logging
    volumes:
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./backend:/var/www/backend:ro
      - ./frontend:/var/www/frontend:ro
    depends_on:
      backend:
        condition: service_started
      frontend:
        condition: service_started
      reverb:
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/up >/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      start_period: 15s
      retries: 12
    networks:
      - mis-network

  backend:
    build:
      context: ./docker/php
      dockerfile: Dockerfile
    image: mis-backend:dev
    restart: unless-stopped
    init: true
    logging: *default-logging
    expose:
      - "9000"
    volumes:
      - ./backend:/var/www/backend
    env_file:
      - .env.backend
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      meilisearch:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "php -r \"exit(is_file('/var/www/backend/vendor/autoload.php') ? 0 : 1);\""]
      interval: 10s
      timeout: 5s
      start_period: 10s
      retries: 18
    networks:
      - mis-network

  reverb:
    build:
      context: ./docker/php
      dockerfile: Dockerfile
    image: mis-reverb:dev
    restart: unless-stopped
    init: true
    logging: *default-logging
    command: php /var/www/backend/artisan reverb:start
    expose:
      - "8080"
    volumes:
      - ./backend:/var/www/backend
    env_file:
      - .env.backend
    depends_on:
      backend:
        condition: service_started
      redis:
        condition: service_healthy
    networks:
      - mis-network

  queue-worker:
    build:
      context: ./docker/php
      dockerfile: Dockerfile
    image: mis-queue-worker:dev
    restart: unless-stopped
    init: true
    logging: *default-logging
    command: php /var/www/backend/artisan queue:work --sleep=3 --tries=3
    volumes:
      - ./backend:/var/www/backend
    env_file:
      - .env.backend
    depends_on:
      backend:
        condition: service_started
      redis:
        condition: service_healthy
    networks:
      - mis-network

  scheduler:
    build:
      context: ./docker/php
      dockerfile: Dockerfile
    image: mis-scheduler:dev
    restart: unless-stopped
    init: true
    logging: *default-logging
    command: php /var/www/backend/artisan schedule:work
    volumes:
      - ./backend:/var/www/backend
    env_file:
      - .env.backend
    depends_on:
      backend:
        condition: service_started
    networks:
      - mis-network

  frontend:
    build:
      context: ./frontend
      dockerfile: ../docker/node/Dockerfile
      args:
        NEXT_BUILD: "false"
    image: mis-frontend:dev
    restart: unless-stopped
    init: true
    logging: *default-logging
    command: pnpm dev
    # Direct host port: development only.
    ports:
      - "3000:3000"
    volumes:
      - ./frontend:/var/www/frontend
      - /var/www/frontend/node_modules
      - /var/www/frontend/.next
    env_file:
      - .env.frontend
    depends_on:
      backend:
        condition: service_started
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000').then((r) => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 10s
      timeout: 5s
      start_period: 20s
      retries: 18
    networks:
      - mis-network

  matching:
    build:
      context: ./docker/python
      dockerfile: Dockerfile
      args:
        INSTALL_DEV_DEPS: "true"
    image: mis-matching:dev
    restart: unless-stopped
    init: true
    logging: *default-logging
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000", "--workers", "${MATCHING_WORKERS:-1}"]
    # Direct host port: development only.
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - ./matching-service:/app
    env_file:
      - .env.matching
    environment:
      MATCHING_WORKERS: ${MATCHING_WORKERS:-1}
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/v1/health', timeout=3).read()\""]
      interval: 10s
      timeout: 5s
      start_period: 10s
      retries: 12
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - mis-network

  postgres:
    image: postgres:16.4-alpine
    restart: unless-stopped
    init: true
    logging: *default-logging
    # Direct host port: development only.
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB is required; run bash setup.sh}
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER is required; run bash setup.sh}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required; run bash setup.sh}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 10s
      timeout: 5s
      retries: 12
    networks:
      - mis-network

  redis:
    image: redis:7.4-alpine
    restart: unless-stopped
    init: true
    logging: *default-logging
    # Direct host port: development only.
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 12
    networks:
      - mis-network

  meilisearch:
    image: getmeili/meilisearch:v1.50.0
    restart: unless-stopped
    init: true
    logging: *default-logging
    # Direct host port: development only.
    ports:
      - "127.0.0.1:7700:7700"
    volumes:
      - meilidata:/meili_data
    environment:
      MEILI_ENV: development
      MEILI_MASTER_KEY: ${MEILI_MASTER_KEY:?MEILI_MASTER_KEY is required; run bash setup.sh}
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:7700/health >/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
    networks:
      - mis-network

  mailpit:
    image: axllent/mailpit:v1.21.8
    restart: unless-stopped
    init: true
    logging: *default-logging
    # Direct host ports: development only.
    ports:
      - "127.0.0.1:1025:1025"
      - "127.0.0.1:8025:8025"
    networks:
      - mis-network

volumes:
  pgdata:
  redisdata:
  meilidata:

networks:
  mis-network:
    driver: bridge
